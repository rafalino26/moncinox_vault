<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5efff">
  <title>Sedang offline · Moncinox Vault</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: linear-gradient(#f5efff, #ebe0fa); color: #674087; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
    main { max-width: 340px; }
    img { display: block; width: 112px; height: 136px; object-fit: contain; margin: 0 auto 24px; }
    h1 { font-size: 25px; line-height: 1.3; margin: 0 0 12px; }
    p { color: #8a709d; font-size: 14px; margin: 0 0 24px; }
    a { display: inline-block; padding: 12px 24px; border-radius: 16px; background: #8657ad; color: white; text-decoration: none; font-weight: 650; }
    a:focus-visible { outline: 3px solid #b28ccf; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/stickers/stitchblue3.png" alt="" width="112" height="136">
    <h1>Lagi offline</h1>
    <p>Sambungkan internet untuk melihat saldo dan mencatat transaksi lagi.</p>
    <a href="/">Coba buka lagi</a>
  </main>
</body>
</html>
